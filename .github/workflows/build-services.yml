name: build-services
# Builds the 7 container images, pushes them to Artifact Registry and commits the new image tags to
# k8s/apps/kustomization.yaml. ArgoCD notices the commit and rolls the deployment out (GitOps) -
# the pipeline never talks to the cluster.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "proto/**"
      - ".github/workflows/build-services.yml"
  workflow_dispatch:

concurrency:
  group: build-services
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [building-registry, sensor-ingestion, occupancy-service, energy-monitor,
                  control-optimizer, hvac-controller, building-simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Load CI config
        run: grep -v '^#' .github/ci-config.env >> "$GITHUB_ENV"
      - name: Check repository is configured
        run: test -n "$GCP_WIF_PROVIDER" || (echo "Run scripts/configure-repo.sh first" && exit 1)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load CI config
        run: grep -v '^#' .github/ci-config.env >> "$GITHUB_ENV"
      - name: Set new image tags in the GitOps manifests
        run: python3 scripts/set_image_tags.py "$IMAGE_REPOSITORY" "$GITHUB_SHA"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/kustomization.yaml
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "deploy: images ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
