apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-building
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/codelord27-hub/smart-building.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: smart-building
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
  # HPAs own the replica count of these deployments
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
