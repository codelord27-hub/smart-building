# 2. Sensor Ingestion - REST -> Kafka "sensor-readings", raw archive -> Cloud Storage. Stateless, HPA on CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-ingestion
  labels: {app: sensor-ingestion, app.kubernetes.io/part-of: smart-building}
spec:
  selector:
    matchLabels: {app: sensor-ingestion}
  template:
    metadata:
      labels: {app: sensor-ingestion, app.kubernetes.io/part-of: smart-building}
    spec:
      serviceAccountName: sb-app
      containers:
        - name: app
          image: sensor-ingestion
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - {name: SERVICE_NAME, value: sensor-ingestion}
            - {name: ARCHIVE_INTERVAL_SECONDS, value: "30"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-ingestion
  labels: {app: sensor-ingestion, app.kubernetes.io/part-of: smart-building}
spec:
  selector: {app: sensor-ingestion}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sensor-ingestion
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sensor-ingestion}
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 2, periodSeconds: 15}]
    scaleDown:
      stabilizationWindowSeconds: 60
      policies: [{type: Pods, value: 1, periodSeconds: 30}]
