# 6. HVAC Controller - 2PC participant (gRPC :50051) + REST, Cloud SQL db "hvac", emits hvac_command -> Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hvac-controller
  labels: {app: hvac-controller, app.kubernetes.io/part-of: smart-building}
spec:
  replicas: 2
  selector:
    matchLabels: {app: hvac-controller}
  template:
    metadata:
      labels: {app: hvac-controller, app.kubernetes.io/part-of: smart-building}
    spec:
      serviceAccountName: sb-app
      containers:
        - name: app
          image: hvac-controller
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 50051}
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: db-credentials}
          env:
            - {name: SERVICE_NAME, value: hvac-controller}
            - {name: DB_NAME, value: hvac}
            - {name: GRPC_PORT, value: "50051"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hvac-controller
  labels: {app: hvac-controller, app.kubernetes.io/part-of: smart-building}
spec:
  selector: {app: hvac-controller}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: grpc, port: 50051, targetPort: grpc, appProtocol: kubernetes.io/h2c}
