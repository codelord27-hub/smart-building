# Kafka cluster on GKE managed by the Strimzi operator (KRaft mode, single combined
# controller+broker node - enough for the course demo).
#   internal listener  sb-kafka-kafka-bootstrap.kafka.svc:9092   (microservices in GKE)
#   external listener  internal TCP load balancer :9094           (Flink job on Dataproc, same VPC)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: sb-kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2Gi}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: sb-kafka
  annotations:
    # required by Strimzi < 0.48, ignored by newer versions
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: loadbalancer
        tls: false
        # static internal IPs reserved by Terraform (infra/terraform/2-infra/network.tf)
        configuration:
          bootstrap:
            loadBalancerIP: 10.10.15.240
          brokers:
            - broker: 0
              loadBalancerIP: 10.10.15.241
    template:
      externalBootstrapService:
        metadata:
          annotations:
            networking.gke.io/load-balancer-type: "Internal"
      perPodService:
        metadata:
          annotations:
            networking.gke.io/load-balancer-type: "Internal"
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      log.retention.hours: 24
  entityOperator:
    topicOperator: {}
    userOperator: {}
